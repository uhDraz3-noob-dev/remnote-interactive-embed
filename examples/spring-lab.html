<!-- Recommended embed height: 620px -->
<main id="spring-lab" data-interactive-embed="1">
  <header><small>EXPERIMENT LAB</small><h1>A spring in motion</h1><p>Pull the mass or change the stiffness. Explore how the restoring force changes.</p></header>
  <canvas aria-label="Spring and mass diagram. Use the position slider below as an alternative to dragging." role="img"></canvas>
  <div class="sl-controls">
    <label>Position <input data-position type="range" min="-100" max="100" step="0.1" value="40"><output data-distance></output></label>
    <label>Stiffness <input data-stiffness type="range" min="1" max="10" value="4"><output data-k></output></label>
  </div>
  <p class="sl-result"></p>
  <div class="sl-actions"><button type="button" data-play>Play motion</button><button type="button" data-step>Step</button><button type="button" data-reset>Reset</button></div>
  <p class="sl-takeaway">The force points toward the center and grows with distance: F = −kx. This is a simplified, damped spring model with mass = 1.</p>
</main>
<style>
  #spring-lab{max-width:920px;margin:auto;padding:clamp(16px,4vw,32px);font:16px/1.5 system-ui;color:#e5ecff;background:#111a2e;min-height:100%;box-sizing:border-box}
  #spring-lab *{box-sizing:border-box}#spring-lab h1{font-size:clamp(24px,5vw,36px);margin:4px 0}#spring-lab p{margin:8px 0 16px}#spring-lab small{color:#71ddcf;letter-spacing:.14em}
  #spring-lab canvas{display:block;width:100%;height:190px;border-radius:16px;background:#1b2842}
  #spring-lab .sl-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:20px;margin-top:20px}
  #spring-lab label{display:grid;gap:4px}#spring-lab input{width:100%;min-height:44px;accent-color:#71ddcf}#spring-lab output{color:#b7c7e8}
  #spring-lab .sl-actions{display:flex;flex-wrap:wrap;gap:10px}#spring-lab button{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid #6b84b3;background:#263956;color:#fff;font:inherit;cursor:pointer}
  #spring-lab button:focus-visible,#spring-lab input:focus-visible{outline:3px solid #71ddcf;outline-offset:3px}#spring-lab .sl-result{font-weight:700;color:#71ddcf}#spring-lab .sl-takeaway{margin-top:18px;font-size:14px;color:#b7c7e8}
</style>
<script>
(function () {
  const root = document.getElementById('spring-lab');
  const ui = window.InteractiveEmbed;
  if (!ui || ui.version !== 1) { root.textContent = 'This example needs Interactive Embed runtime v1.'; return; }
  const find = (selector) => root.querySelector(selector);
  let surface, stop = null;
  const initial = { x: 0.4, velocity: 0, k: 4 };
  const state = ui.store(initial, (s) => {
    find('[data-position]').value = String(s.x * 100);
    find('[data-stiffness]').value = String(s.k);
    find('[data-distance]').textContent = s.x.toFixed(2) + ' m';
    find('[data-k]').textContent = s.k + ' N/m';
    find('.sl-result').textContent = 'Restoring force: ' + (-s.k * s.x).toFixed(2) + ' N';
    if (surface) surface.redraw();
  });
  surface = ui.canvas(find('canvas'), (ctx, width, height) => {
    const s = state.get(), center = width / 2, x = center + s.x * width * 0.28, y = height / 2;
    ctx.strokeStyle = '#6b84b3'; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(center, 20); ctx.lineTo(center, height - 20); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#71ddcf'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(20, y);
    for (let i = 1; i <= 20; i++) ctx.lineTo(20 + (x - 40) * i / 20, y + (i % 2 ? -12 : 12));
    ctx.lineTo(x, y); ctx.stroke(); ctx.fillStyle = '#71ddcf'; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b7c7e8'; ctx.font = '14px system-ui'; ctx.fillText('Drag the mass', 16, 28);
  });
  function pause() { if (stop) stop(); stop = null; find('[data-play]').textContent = 'Play motion'; }
  function step(dt) {
    state.set((s) => { const v = s.velocity + (-s.k * s.x - 0.35 * s.velocity) * dt;
      return { velocity: v, x: ui.clamp(s.x + v * dt, -1, 1) }; });
    const s = state.get(); if (Math.abs(s.x) + Math.abs(s.velocity) < 0.002) pause();
  }
  ui.on(find('[data-position]'), 'input', (event) => { pause(); state.set({ x: Number(event.target.value) / 100, velocity: 0 }); });
  ui.on(find('[data-stiffness]'), 'input', (event) => state.set({ k: Number(event.target.value) }));
  ui.on(find('[data-reset]'), 'click', () => { pause(); state.reset(); });
  ui.on(find('[data-step]'), 'click', () => { pause(); step(0.05); });
  ui.on(find('[data-play]'), 'click', () => {
    if (stop) { pause(); return; }
    if (ui.reducedMotion) { step(0.05); return; }
    stop = ui.animate(step); find('[data-play]').textContent = 'Pause';
  });
  ui.drag(find('canvas'), (p) => { pause(); state.set({ x: ui.clamp((p.x - p.width / 2) / (p.width * 0.28), -1, 1), velocity: 0 }); });
})();
</script>
